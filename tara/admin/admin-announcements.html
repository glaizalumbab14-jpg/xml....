<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcements - Rentarium</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .announcement-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border-left: 4px solid #3498db;
        }
        .announcement-card.high-priority {
            border-left-color: #e74c3c;
        }
        .announcement-card.medium-priority {
            border-left-color: #f39c12;
        }
        .announcement-card.low-priority {
            border-left-color: #27ae60;
        }
        .announcement-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }
        .announcement-priority {
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            color: white;
        }
        .priority-high {
            background: #e74c3c;
        }
        .priority-medium {
            background: #f39c12;
        }
        .priority-low {
            background: #27ae60;
        }
        .announcement-date {
            color: #666;
            font-size: 14px;
        }
        .announcement-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        .create-announcement-btn {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Rentarium</h2>
                <div class="user-info">
                    <div class="user-avatar">A</div>
                    <div>
                        <p id="adminName">System Admin</p>
                        <small>Administrator</small>
                    </div>
                </div>
            </div>
            
            <ul class="sidebar-menu">
                <li><a href="admin-dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                <li><a href="admin-create-tenant.html"><i class="fas fa-user-plus"></i> Create Tenant</a></li>
                <li><a href="admin-manage-rooms.html"><i class="fas fa-home"></i> Manage Rooms</a></li>
                <li><a href="admin-rental-requests.html"><i class="fas fa-file-contract"></i> Rental Requests</a></li>
                <li><a href="admin-payment-records.html"><i class="fas fa-credit-card"></i> Payments</a></li>
                <li><a href="admin-tenant-list.html"><i class="fas fa-users"></i> Tenant List</a></li>
                <li><a href="admin-announcements.html" class="active"><i class="fas fa-bullhorn"></i> Announcements</a></li>
                <li><button class="logout-btn btn" onclick="authSystem.logout()"><i class="fas fa-sign-out-alt"></i> Logout</button></li>
            </ul>
        </aside>

        <main class="main-content">
            <div class="top-bar">
                <div class="page-title">
                    <h1>Announcements</h1>
                    <p>Post and manage announcements for tenants</p>
                </div>
                <button class="btn btn-primary" onclick="showCreateAnnouncementModal()">
                    <i class="fas fa-plus"></i> Create Announcement
                </button>
            </div>

            <div class="content-container">
                <!-- Announcements List -->
                <div id="announcementsContainer">
                    <!-- Announcements will be loaded here -->
                </div>
            </div>
        </main>
    </div>

    <!-- Create Announcement Modal -->
    <div id="createAnnouncementModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Create Announcement</h3>
                <button class="close-modal" onclick="closeCreateAnnouncementModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="createAnnouncementForm">
                    <div class="form-group">
                        <label>Title *</label>
                        <input type="text" id="announcementTitle" required placeholder="Enter announcement title">
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>Priority *</label>
                            <select id="announcementPriority" required>
                                <option value="">Select Priority</option>
                                <option value="high">High</option>
                                <option value="medium">Medium</option>
                                <option value="low">Low</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Category</label>
                            <select id="announcementCategory">
                                <option value="">Select Category</option>
                                <option value="maintenance">Maintenance</option>
                                <option value="payment">Payment</option>
                                <option value="general">General</option>
                                <option value="emergency">Emergency</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Content *</label>
                        <textarea id="announcementContent" rows="5" required placeholder="Enter announcement content"></textarea>
                    </div>
                    
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Post Announcement</button>
                        <button type="button" class="btn btn-secondary" onclick="closeCreateAnnouncementModal()">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Edit Announcement Modal -->
    <div id="editAnnouncementModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Edit Announcement</h3>
                <button class="close-modal" onclick="closeEditAnnouncementModal()">&times;</button>
            </div>
            <div class="modal-body" id="editAnnouncementContent">
                <!-- Edit form will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../js/auth.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/announcements.js"></script>
    <script>
        // Check authentication
        if (!authSystem.requireAuth('admin')) {
            window.location.href = '../admin-login.html';
        }

        const announcementManager = window.announcementManager || new AnnouncementManager();
        let currentAnnouncementId = null;

        document.addEventListener('DOMContentLoaded', function() {
            const admin = authSystem.getCurrentUser();
            if (admin) {
                document.getElementById('adminName').textContent = admin.fullName || admin.username;
            }
            loadAnnouncements();
        });

        function loadAnnouncements() {
            const announcements = announcementManager.getAllAnnouncements();
            displayAnnouncements(announcements);
        }

        function displayAnnouncements(announcements) {
            const container = document.getElementById('announcementsContainer');
            
            if (announcements.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-bullhorn fa-3x" style="color: #ddd; margin-bottom: 20px;"></i>
                        <h3>No Announcements</h3>
                        <p>Create your first announcement to notify tenants.</p>
                        <button class="btn btn-primary" onclick="showCreateAnnouncementModal()">
                            <i class="fas fa-plus"></i> Create Announcement
                        </button>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = '';
            
            // Sort by date (newest first)
            announcements.sort((a, b) => new Date(b.date) - new Date(a.date));
            
            announcements.forEach(announcement => {
                let priorityClass = '';
                let priorityText = '';
                let priorityBadgeClass = '';
                
                switch(announcement.priority) {
                    case 'high':
                        priorityClass = 'high-priority';
                        priorityText = 'High Priority';
                        priorityBadgeClass = 'priority-high';
                        break;
                    case 'medium':
                        priorityClass = 'medium-priority';
                        priorityText = 'Medium Priority';
                        priorityBadgeClass = 'priority-medium';
                        break;
                    case 'low':
                        priorityClass = 'low-priority';
                        priorityText = 'Low Priority';
                        priorityBadgeClass = 'priority-low';
                        break;
                }
                
                const announcementCard = document.createElement('div');
                announcementCard.className = `announcement-card ${priorityClass}`;
                
                announcementCard.innerHTML = `
                    <div class="announcement-header">
                        <div>
                            <h3 style="margin: 0 0 5px 0;">${announcement.title}</h3>
                            <p class="announcement-date">
                                <i class="fas fa-calendar-alt"></i> ${RentariumUtils.formatDate(announcement.date)}
                                ${announcement.category ? `<span style="margin-left: 15px;"><i class="fas fa-tag"></i> ${announcement.category}</span>` : ''}
                            </p>
                        </div>
                        <span class="announcement-priority ${priorityBadgeClass}">${priorityText}</span>
                    </div>
                    
                    <div style="margin-top: 15px;">
                        <p style="white-space: pre-wrap;">${announcement.content}</p>
                    </div>
                    
                    <div class="announcement-actions">
                        <button class="btn-action btn-edit" onclick="editAnnouncement('${announcement.id}')">
                            <i class="fas fa-edit"></i> Edit
                        </button>
                        <button class="btn-action btn-delete" onclick="deleteAnnouncement('${announcement.id}')">
                            <i class="fas fa-trash"></i> Delete
                        </button>
                    </div>
                `;
                
                container.appendChild(announcementCard);
            });
        }

        function showCreateAnnouncementModal() {
            document.getElementById('createAnnouncementModal').classList.add('active');
        }

        function closeCreateAnnouncementModal() {
            document.getElementById('createAnnouncementModal').classList.remove('active');
            document.getElementById('createAnnouncementForm').reset();
        }

        // Handle create announcement form submission
        document.getElementById('createAnnouncementForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const announcementData = {
                title: document.getElementById('announcementTitle').value,
                content: document.getElementById('announcementContent').value,
                priority: document.getElementById('announcementPriority').value,
                category: document.getElementById('announcementCategory').value || 'general'
            };

            const result = announcementManager.createAnnouncement(announcementData);
            if (result.success) {
                RentariumUtils.showNotification('Announcement posted successfully!', 'success');
                closeCreateAnnouncementModal();
                loadAnnouncements();
            } else {
                RentariumUtils.showNotification(result.message, 'error');
            }
        });

        function editAnnouncement(announcementId) {
            currentAnnouncementId = announcementId;
            const announcement = announcementManager.getAnnouncementById(announcementId);
            
            if (!announcement) return;
            
            const editContent = `
                <form id="editAnnouncementForm" onsubmit="saveAnnouncementChanges(event)">
                    <input type="hidden" id="editAnnouncementId" value="${announcement.id}">
                    
                    <div class="form-group">
                        <label>Title *</label>
                        <input type="text" id="editAnnouncementTitle" value="${announcement.title}" required>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>Priority *</label>
                            <select id="editAnnouncementPriority" required>
                                <option value="high" ${announcement.priority === 'high' ? 'selected' : ''}>High</option>
                                <option value="medium" ${announcement.priority === 'medium' ? 'selected' : ''}>Medium</option>
                                <option value="low" ${announcement.priority === 'low' ? 'selected' : ''}>Low</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Category</label>
                            <select id="editAnnouncementCategory">
                                <option value="">Select Category</option>
                                <option value="maintenance" ${announcement.category === 'maintenance' ? 'selected' : ''}>Maintenance</option>
                                <option value="payment" ${announcement.category === 'payment' ? 'selected' : ''}>Payment</option>
                                <option value="general" ${announcement.category === 'general' ? 'selected' : ''}>General</option>
                                <option value="emergency" ${announcement.category === 'emergency' ? 'selected' : ''}>Emergency</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Content *</label>
                        <textarea id="editAnnouncementContent" rows="5" required>${announcement.content}</textarea>
                    </div>
                    
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                        <button type="button" class="btn btn-secondary" onclick="closeEditAnnouncementModal()">Cancel</button>
                    </div>
                </form>
            `;
            
            document.getElementById('editAnnouncementContent').innerHTML = editContent;
            document.getElementById('editAnnouncementModal').classList.add('active');
        }

        function saveAnnouncementChanges(e) {
            e.preventDefault();
            
            const announcementId = document.getElementById('editAnnouncementId').value;
            const updateData = {
                title: document.getElementById('editAnnouncementTitle').value,
                content: document.getElementById('editAnnouncementContent').value,
                priority: document.getElementById('editAnnouncementPriority').value,
                category: document.getElementById('editAnnouncementCategory').value || 'general'
            };

            const result = announcementManager.updateAnnouncement(announcementId, updateData);
            if (result.success) {
                RentariumUtils.showNotification('Announcement updated successfully!', 'success');
                closeEditAnnouncementModal();
                loadAnnouncements();
            } else {
                RentariumUtils.showNotification(result.message, 'error');
            }
        }

        document.getElementById('createAnnouncementForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const announcementData = {
        title: document.getElementById('announcementTitle').value,
        content: document.getElementById('announcementContent').value,
        priority: document.getElementById('announcementPriority').value,
        category: document.getElementById('announcementCategory').value || 'general',
        pinned: document.getElementById('announcementPinned')?.checked || false
    };

    const result = announcementManager.createAnnouncement(announcementData);
    if (result.success) {
        RentariumUtils.showNotification('Announcement posted successfully!', 'success');
        closeCreateAnnouncementModal();
        loadAnnouncements();
    } else {
        RentariumUtils.showNotification(result.message, 'error');
    }
});

        function closeEditAnnouncementModal() {
            document.getElementById('editAnnouncementModal').classList.remove('active');
            currentAnnouncementId = null;
        }

        async function deleteAnnouncement(announcementId) {
            const confirm = await RentariumUtils.confirmAction('Are you sure you want to delete this announcement?');
            if (!confirm) return;
            
            const result = announcementManager.deleteAnnouncement(announcementId);
            if (result.success) {
                RentariumUtils.showNotification('Announcement deleted successfully!', 'success');
                loadAnnouncements();
            } else {
                RentariumUtils.showNotification(result.message, 'error');
            }
        }
    </script>
</body>
</html>
